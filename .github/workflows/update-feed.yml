name: Update cyber feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/update-feed.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: cyber-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: collector/requirements.txt

      - name: Install collector
        run: pip install -r collector/requirements.txt

      - name: Collect latest cyber intelligence
        run: python collector/collect.py

      - name: Commit changes
        run: |
          if git diff --quiet -- data/feed.json; then
            echo "No feed change."
            exit 0
          fi
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          git commit -m "data: refresh cyber feed"
          git push
