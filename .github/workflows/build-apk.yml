name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CyberWatch.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberWatch-APK
          path: CyberWatch.apk

      - name: Publish/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cyberwatch-latest
          name: CyberWatch Mobile - Latest APK
          prerelease: true
          make_latest: true
          files: CyberWatch.apk
          body: |
            APK Android généré automatiquement depuis la branche main.
            Téléchargez CyberWatch.apk puis installez-le sur votre téléphone Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
